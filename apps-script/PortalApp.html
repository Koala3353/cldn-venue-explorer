<script>
(function () {
  'use strict';

  var B = window.BOOT;
  var ACCOUNT = B.account;
  var main = document.getElementById('main');
  var VENUES = B.venues;
  var venueByKey = {};
  VENUES.forEach(function (v) { venueByKey[key(v.name)] = v; });
  var agi = window.Agi || { react: function () {} };

  // ---------- helpers ----------
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(text) {
    return String(text == null ? '' : text).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function key(text) { return String(text || '').trim().toLowerCase().replace(/\s+/g, ' '); }
  function clock(min) {
    var h = Math.floor(min / 60) % 24, m = min % 60;
    return (h % 12 === 0 ? 12 : h % 12) + ':' + (m < 10 ? '0' : '') + m + ' ' + (h < 12 ? 'AM' : 'PM');
  }
  function hhmm(min) { var h = Math.floor(min / 60), m = min % 60; return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m; }
  function toMinutes(text) { var m = /^(\d{1,2}):(\d{2})/.exec(text || ''); return m ? Number(m[1]) * 60 + Number(m[2]) : null; }
  function duration(min) { var h = Math.floor(min / 60), m = min % 60; return (h ? h + 'h' : '') + (h && m ? ' ' : '') + (m ? m + 'm' : ''); }
  function parseISO(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function addDays(s, n) { var d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
  function dayLabel(s) {
    var label = parseISO(s).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
    var rest = label.split(', ').slice(1).join(', ');
    if (s === B.today) return 'Today, ' + rest;
    if (s === addDays(B.today, 1)) return 'Tomorrow, ' + rest;
    return label;
  }
  function shortDate(s) { return parseISO(s).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); }
  function datesBetween(a, b) { var out = [], d = a; while (d <= b && out.length < 60) { out.push(d); d = addDays(d, 1); } return out; }
  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }
  function debounce(fn, ms) { var t; return function () { var a = arguments; clearTimeout(t); t = setTimeout(function () { fn.apply(null, a); }, ms); }; }
  function storageGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function storageSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function toast(message) {
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = message;
    $('#toasts').appendChild(el);
    setTimeout(function () { el.style.opacity = '0'; el.style.transform = 'translateY(8px)'; }, 2800);
    setTimeout(function () { el.remove(); }, 3100);
  }

  // ---------- custom illustrations ----------
  var ART = {
    // A calendar page being scanned: free slots light up in lime, busy ones grey, then a tick.
    loader: function () {
      var busy = { 1: 1, 6: 1, 8: 1 }, cells = '';
      for (var i = 0; i < 12; i++) {
        var col = i % 4, row = Math.floor(i / 4);
        cells += '<rect class="cell' + (busy[i] ? ' busy' : '') + '" x="' + (15 + col * 16.5) + '" y="' + (38 + row * 14) + '" width="12" height="10" rx="3" style="--d:' + (row * 4 + col) + '"/>';
      }
      return '<svg class="cal-loader" viewBox="0 0 96 96" aria-hidden="true">' +
        '<rect class="page" x="8" y="14" width="80" height="76" rx="14"/>' +
        '<path class="top" d="M8 28a14 14 0 0 1 14-14h52a14 14 0 0 1 14 14v2H8z"/>' +
        '<path class="ring" d="M30 8v12M66 8v12"/>' + cells +
        '<rect class="scan" x="11" y="35" width="74" height="12" rx="4"/>' +
        '<circle class="tick-bg" cx="74" cy="78" r="13"/><path class="tick" d="M67 78l5 5 9-10"/>' +
      '</svg>';
    },
    search: '<svg viewBox="0 0 72 72" aria-hidden="true"><rect x="6" y="12" width="44" height="40" rx="8" fill="var(--card)" stroke="var(--edge)" stroke-width="3"/><path d="M6 24h44" stroke="var(--edge)" stroke-width="3"/><rect x="14" y="31" width="9" height="7" rx="2" fill="var(--hair)"/><rect x="28" y="31" width="9" height="7" rx="2" fill="var(--cobalt)"/><circle cx="48" cy="46" r="11" fill="var(--lemon)" stroke="var(--edge)" stroke-width="3"/><path d="M56 54l9 9" stroke="var(--edge)" stroke-width="4" stroke-linecap="round"/></svg>',
    check: '<svg viewBox="0 0 72 72" aria-hidden="true"><rect x="10" y="10" width="52" height="52" rx="12" fill="var(--mint)" stroke="var(--edge)" stroke-width="3"/><path d="M23 37l9 9 17-19" fill="none" stroke="var(--edge)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    send: '<svg viewBox="0 0 72 72" aria-hidden="true"><rect x="8" y="14" width="40" height="48" rx="7" fill="var(--card)" stroke="var(--edge)" stroke-width="3"/><path d="M16 28h24M16 37h24M16 46h14" stroke="var(--hair)" stroke-width="4" stroke-linecap="round"/><path d="M38 34l28-16-10 34-7-11z" fill="var(--pink)" stroke="var(--edge)" stroke-width="3" stroke-linejoin="round"/></svg>',
    empty: '<svg viewBox="0 0 112 112" aria-hidden="true"><rect x="16" y="22" width="80" height="70" rx="14" fill="var(--card)" stroke="var(--edge)" stroke-width="3.5"/><path d="M16 42h80" stroke="var(--edge)" stroke-width="3.5"/><path d="M36 14v14M76 14v14" stroke="var(--edge)" stroke-width="3.5" stroke-linecap="round"/><path d="M42 62c4-4 8-4 12 0M58 62c4-4 8-4 12 0" fill="none" stroke="var(--edge)" stroke-width="3" stroke-linecap="round"/><path d="M48 78c5-3 11-3 16 0" fill="none" stroke="var(--edge)" stroke-width="3" stroke-linecap="round"/><path d="M88 10l3 6 6 3-6 3-3 6-3-6-6-3 6-3z" fill="var(--lemon)" stroke="var(--edge)" stroke-width="2.5"/></svg>',
    oops: '<svg viewBox="0 0 112 112" aria-hidden="true"><path d="M30 78c-12 0-20-8-20-19 0-10 8-18 18-18 3-13 14-21 27-21 15 0 27 11 28 25 10 1 18 9 18 19 0 8-7 14-15 14z" fill="var(--card)" stroke="var(--edge)" stroke-width="3.5" stroke-linejoin="round"/><path d="M42 52l8 8M50 52l-8 8M62 52l8 8M70 52l-8 8" stroke="var(--edge)" stroke-width="3" stroke-linecap="round"/><path d="M48 70c5-4 11-4 16 0" fill="none" stroke="var(--edge)" stroke-width="3" stroke-linecap="round"/><path d="M40 90l-4 10M56 90v12M72 90l4 10" stroke="var(--coral)" stroke-width="4" stroke-linecap="round"/></svg>',
    lock: '<svg viewBox="0 0 112 112" aria-hidden="true"><path d="M36 50V38a20 20 0 0 1 40 0v12" fill="none" stroke="var(--edge)" stroke-width="5"/><rect x="24" y="48" width="64" height="48" rx="12" fill="var(--lemon)" stroke="var(--edge)" stroke-width="3.5"/><circle cx="56" cy="68" r="6" fill="var(--edge)"/><path d="M56 72v10" stroke="var(--edge)" stroke-width="5" stroke-linecap="round"/><path d="M94 22l3 6 6 3-6 3-3 6-3-6-6-3 6-3z" fill="var(--card)" stroke="var(--edge)" stroke-width="2.5"/></svg>',
    key: '<svg viewBox="0 0 112 112" aria-hidden="true"><circle cx="38" cy="56" r="20" fill="var(--lemon)" stroke="var(--edge)" stroke-width="3.5"/><circle cx="38" cy="56" r="7" fill="var(--card)" stroke="var(--edge)" stroke-width="3"/><path d="M58 56h40M84 56v14M96 56v10" stroke="var(--edge)" stroke-width="5" stroke-linecap="round"/></svg>',
    squiggle: '<svg viewBox="0 0 300 30" preserveAspectRatio="none" aria-hidden="true"><path d="M4 20c30-14 52-14 76 0s48 14 72 0 50-14 74 0 46 12 70 0"/></svg>',
  };
  function loader(text, rows) {
    return '<div class="loader" role="status">' + ART.loader() + '<p>' + esc(text) + '</p></div>' +
      (rows ? '<div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div>' : '');
  }
  function emptyState(art, title, text, action) {
    return '<div class="empty">' + art + '<h3>' + esc(title) + '</h3><p>' + esc(text) + '</p>' + (action || '') + '</div>';
  }

  // ---------- motion helpers ----------
  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Counts a number up from zero, easing out, so the live count reads as fresh.
  function countUp(el) {
    if (!el) return;
    var target = Number(el.getAttribute('data-count')) || 0;
    if (REDUCED || target < 2) { el.textContent = target; return; }
    var t0 = performance.now(), ms = 900;
    (function frame(now) {
      var p = Math.min(1, (now - t0) / ms), eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(target * eased);
      if (p < 1) requestAnimationFrame(frame);
    })(t0);
  }
  // Sections and cards rise in as they scroll into view.
  var revealer = 'IntersectionObserver' in window && !REDUCED ? new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      e.target.classList.add('in');
      revealer.unobserve(e.target);
    });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.12 }) : null;
  function revealify(root) {
    var targets = $all('.section .section-title, .section .section-lead, .flow-list, .bento, .plans, .venue-grid > *, .access-grid > *', root);
    targets.forEach(function (el, i) {
      if (!revealer) { el.classList.add('in'); return; }
      if (!el.classList.contains('flow-list')) el.classList.add('reveal');
      el.style.setProperty('--rd', String(i % 4));
      revealer.observe(el);
    });
  }

  // ---------- plan & usage ----------
  var PRO = ACCOUNT.plan === 'pro';
  var LIMIT_NAMES = { search: 'slot searches', schedule: 'schedule lookups', check: 'calendar checks', link: 'request links', request: 'access requests' };
  function left(kind) {
    var limit = (ACCOUNT.limits || {})[kind] || 0;
    var used = (ACCOUNT.usage || {})[kind] || 0;
    return Math.max(0, limit - used);
  }
  function noteUsage(u) {
    if (!u || !u.kind) return;
    ACCOUNT.usage = ACCOUNT.usage || {};
    ACCOUNT.usage[u.kind] = u.used;
    drawPlanChip();
    var m = $('[data-meter="' + u.kind + '"]');
    if (m) m.outerHTML = meter(u.kind);
  }
  function meter(kind) {
    var limit = (ACCOUNT.limits || {})[kind] || 0;
    if (!limit || limit > 50) return '';
    var used = Math.min(limit, (ACCOUNT.usage || {})[kind] || 0);
    var cells = '';
    for (var i = 0; i < limit && limit <= 10; i++) cells += '<span class="' + (i < used ? 'used' : '') + '"></span>';
    return '<span class="meter" data-meter="' + kind + '"><span class="cells" aria-hidden="true">' + cells + '</span>' +
      (limit - used) + ' of ' + limit + ' ' + LIMIT_NAMES[kind] + ' left today</span>';
  }
  function drawPlanChip() {
    var chip = $('#planChip');
    if (ACCOUNT.plan === 'none') { chip.textContent = 'Sign in'; return; }
    chip.className = 'plan-chip' + (PRO ? ' pro' : '');
    chip.innerHTML = PRO ? '<span class="tag">PRO</span><span class="label-long">Plan</span>'
      : '<span class="tag">FREE</span><span class="num">' + left('search') + '</span><span class="label-long">' + (left('search') === 1 ? 'search' : 'searches') + ' left</span>';
  }

  // ---------- theme ----------
  function applyTheme(theme) {
    if (theme) document.documentElement.setAttribute('data-theme', theme);
    else document.documentElement.removeAttribute('data-theme');
    var dark = theme ? theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    $('#themeToggle i').className = 'ph-bold ' + (dark ? 'ph-sun' : 'ph-moon');
    return dark;
  }
  applyTheme(storageGet('heTheme'));
  $('#themeToggle').addEventListener('click', function () {
    var current = document.documentElement.getAttribute('data-theme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = current === 'dark' ? 'light' : 'dark';
    storageSet('heTheme', next);
    agi.react(applyTheme(next) ? 'dark' : 'light');
  });

  // ---------- account: switch or sign out ----------
  // The page can't sign anyone out itself, so both options go through Google's
  // own pages and then come back here.
  var HOME_URL = B.execUrl || '';
  var SWITCH_URL = 'https://accounts.google.com/AccountChooser?continue=' + encodeURIComponent(HOME_URL);
  var SIGNOUT_URL = 'https://accounts.google.com/Logout?continue=' + encodeURIComponent(SWITCH_URL);
  function accountMenu() {
    var email = ACCOUNT.email || '';
    var plan = ACCOUNT.plan === 'pro' ? 'PRO' : ACCOUNT.plan === 'free' ? 'FREE' : 'NO ACCESS';
    return '<div class="acct-head"><span class="muted">' + (email ? 'Signed in as' : 'Not signed in') + '</span>' +
        (email ? '<span class="acct-email">' + esc(email) + '</span>' : '') +
        '<span class="acct-plan' + (ACCOUNT.plan === 'pro' ? ' pro' : '') + '">' + plan + '</span></div>' +
      (ACCOUNT.plan !== 'none' ? '<a class="acct-item" href="#/access" data-nav><i class="ph-bold ph-key" aria-hidden="true"></i>Your plan</a>' +
        '<a class="acct-item" href="#/report" data-nav><i class="ph-bold ph-megaphone-simple" aria-hidden="true"></i>Report an issue</a>' : '') +
      '<a class="acct-item" href="' + esc(SWITCH_URL) + '" target="_top" data-acct="switch"><i class="ph-bold ph-users-three" aria-hidden="true"></i>Switch account</a>' +
      '<a class="acct-item danger" href="' + esc(SIGNOUT_URL) + '" target="_top" data-acct="signout"><i class="ph-bold ph-sign-out" aria-hidden="true"></i><span>Sign out</span></a>' +
      '<p class="acct-note" id="acctNote">Tip: if lookups fail, you may have several Google accounts signed in. Switch to your @' + esc(ACCOUNT.domain || 'student.ateneo.edu') + ' one.</p>';
  }
  (function setupAccount() {
    var btn = $('#acctBtn'), menu = $('#acctMenu');
    if (!btn || !menu) return;
    $('#acctInitial').textContent = ACCOUNT.email ? ACCOUNT.email.charAt(0).toUpperCase() : '?';
    btn.title = ACCOUNT.email || 'Not signed in';
    function close(focus) {
      if (menu.hidden) return;
      menu.hidden = true;
      btn.setAttribute('aria-expanded', 'false');
      if (focus) btn.focus();
    }
    function open() {
      menu.innerHTML = accountMenu();
      menu.hidden = false;
      btn.setAttribute('aria-expanded', 'true');
      var first = menu.querySelector('.acct-item');
      if (first) first.focus();
    }
    btn.addEventListener('click', function () { if (menu.hidden) open(); else close(true); });
    menu.addEventListener('click', function (e) {
      var item = e.target.closest('.acct-item');
      if (!item) return;
      var kind = item.getAttribute('data-acct');
      if (kind === 'signout' && !item.classList.contains('armed')) {
        // First click explains what happens; the second one signs out.
        e.preventDefault();
        item.classList.add('armed');
        item.querySelector('span').textContent = 'Sign out of all accounts';
        $('#acctNote').textContent = 'Google signs you out of every account in this browser, then asks which one to use. You come back here after.';
        agi.react('locked', 'Sure? That signs out every Google account here.');
        return;
      }
      if (kind) { agi.react('bye'); return; }
      close(false);
    });
    document.addEventListener('pointerdown', function (e) { if (!menu.hidden && !e.target.closest('.acct')) close(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(true); });
  })();

  // ---------- server calls ----------
  function api(fn, args) {
    args = args || [];
    var pre = B.prefetch;
    if (pre && pre.fn === fn && JSON.stringify(pre.args) === JSON.stringify(args)) {
      B.prefetch = null;
      return pre.error ? Promise.reject(new Error(pre.error)) : Promise.resolve(pre.result);
    }
    return new Promise(function (resolve, reject) {
      if (!window.google || !google.script || !google.script.run) {
        reject(new Error('Open the portal from its link to use this.'));
        return;
      }
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      runner[fn].apply(runner, args);
    });
  }
  function reloadUrl(fn, args, view, viewState) {
    if (!B.execUrl) return '';
    return B.execUrl + '?view=' + encodeURIComponent(view) +
      '&state=' + encodeURIComponent(JSON.stringify(viewState || {})) +
      '&q=' + encodeURIComponent(JSON.stringify({ fn: fn, args: args }));
  }
  // Server errors carry a code: LIMIT:<kind>, PRO:<feature>, ACCESS:<text>.
  function errorCode(error) {
    var m = /(LIMIT|PRO|ACCESS):(.*)$/.exec((error && error.message) || '');
    return m ? { type: m[1], what: m[2].trim() } : null;
  }
  function friendlyError(error) {
    var code = errorCode(error);
    if (code && code.type === 'LIMIT') return 'You have used today\'s free ' + (LIMIT_NAMES[code.what] || 'lookups') + '. They reset at midnight, or go Pro for more.';
    if (code && code.type === 'PRO') return code.what === 'range' ? 'Free searches cover one day at a time. Pro searches up to 14 days.' : 'That is a Pro feature.';
    if (code && code.type === 'ACCESS') return code.what;
    var msg = (error && error.message) || '';
    if (/authorization is required|authorisation/i.test(msg)) {
      return 'The site needs its owner to approve new permissions. Let the site owner know, then try again.';
    }
    if (!msg || /server error|paumanhin|we're sorry|authorization/i.test(msg)) {
      return 'Google blocked the live request. This usually happens when several Google accounts are signed in. A page reload runs it another way.';
    }
    return msg.replace(/^(Exception|Error):\s*/, '');
  }
  // The last thing that went wrong, offered on the report page.
  var LAST_ERROR = '';
  function rememberError(error) {
    LAST_ERROR = ((current ? (ROUTE_NAMES[current] || current) + ': ' : '') + ((error && error.message) || String(error || ''))).slice(0, 300);
  }
  var ROUTE_NAMES = { '': 'Home', find: 'Find a slot', schedule: 'Schedule', venues: 'Venues', book: 'Book', access: 'Plan', report: 'Report' };
  function failureBlock(error, retryUrl) {
    var code = errorCode(error);
    if (code && (code.type === 'LIMIT' || code.type === 'PRO')) {
      agi.react(code.type === 'LIMIT' ? 'limit' : 'locked', code.type === 'LIMIT' ? 'That\'s all the free ones for today.' : null);
      return emptyState(ART.lock, code.type === 'LIMIT' ? 'Out of free lookups for today' : 'Pro feature', friendlyError(error),
        '<a class="btn btn-lemon" href="#/access" data-nav>See plans</a>');
    }
    agi.react('error');
    rememberError(error);
    return emptyState(ART.oops, 'That lookup didn\'t go through', friendlyError(error),
      '<div class="gate-actions">' + (retryUrl ? '<a class="btn btn-primary" href="' + esc(retryUrl) + '" target="_top">Try again with a page reload</a>' : '') +
      '<a class="btn" href="' + esc(SWITCH_URL) + '" target="_top"><i class="ph-bold ph-users-three" aria-hidden="true"></i>Switch account</a>' +
      '<a class="btn" href="#/report" data-nav><i class="ph-bold ph-megaphone-simple" aria-hidden="true"></i>Report it</a></div>');
  }

  // ---------- routing ----------
  var ROUTES = { '': renderHome, find: renderFind, schedule: renderSchedule, venues: renderVenues, book: renderBook, access: renderAccess, report: renderReport };
  var current = null;
  var HISTORY = window.google && google.script && google.script.history ? google.script.history : null;

  function cleanRoute(r) { r = String(r || '').replace(/^#?\/?/, '').split('?')[0]; return ROUTES.hasOwnProperty(r) ? r : ''; }
  function go(route, patch) {
    route = cleanRoute(route);
    if (patch) Object.assign(state[route], patch);
    if (HISTORY) {
      try { if (route !== current) HISTORY.push({ route: route }, {}, '/' + route); } catch (e) { /* the view still changes */ }
      show(route);
    } else if (cleanRoute(location.hash) !== route) {
      location.hash = '#/' + route;
    } else {
      show(route);
    }
  }
  function show(route) {
    var next = cleanRoute(route);
    if (next === 'report' && current !== 'report') state.report.from = current || '';
    var changed = next !== current;
    current = next;
    $all('[data-route]').forEach(function (a) {
      if (a.getAttribute('data-route') === current) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
    main.className = '';
    void main.offsetWidth;
    main.className = 'view-enter';
    if (ACCOUNT.plan === 'none' && current !== '') renderGate();
    else ROUTES[current]();
    revealify(main);
    window.scrollTo(0, 0);
    if (changed) agi.react('nav', null, { route: current });
  }
  if (HISTORY) HISTORY.setChangeHandler(function (e) { show((e.state && e.state.route) || (e.location && e.location.hash) || ''); });
  else window.addEventListener('hashchange', function () { show(location.hash); });
  document.addEventListener('click', function (event) {
    var link = event.target.closest('[data-nav]');
    if (!link) return;
    event.preventDefault();
    go(link.getAttribute('href'));
  });

  // ---------- state ----------
  var defaultType = B.types.indexOf('Classrooms') !== -1 ? 'Classrooms' : '';
  var state = {
    '': {},
    find: { startDate: B.today, endDate: B.today, type: defaultType, building: '', minCapacity: '', airCon: false, minFree: '60',
      timeMode: 'any', fromTime: '', toTime: '', text: '', equipment: '', maxCapacity: '', days: 'all', sort: 'earliest', result: null },
    schedule: { venue: '', startDate: B.today, endDate: PRO ? addDays(B.today, 6) : B.today, result: null },
    venues: { q: '', type: '', building: '', airCon: false, minCapacity: '' },
    book: { venue: '', date: B.today, startTime: '', endTime: '', participants: '', eventTitle: '', proofLink: '',
      nature: B.form.eventDefaults.nature || '', conditions: (B.form.eventDefaults.conditions || []).slice(),
      activityDetails: B.form.eventDefaults.activityDetails || '', equipment: (B.form.eventDefaults.equipment || []).slice() },
    access: {},
    report: { kind: 'bug', page: '', message: '', from: '' },
  };
  if (B.view && state[B.view] && B.state) Object.assign(state[B.view], B.state);

  function typeOptions(selected, allLabel) {
    return '<option value="">' + esc(allLabel) + '</option>' + B.types.map(function (t) {
      return '<option' + (t === selected ? ' selected' : '') + '>' + esc(t) + '</option>';
    }).join('');
  }
  function buildingOptions(selected) {
    return '<option value="">Any building</option>' + B.buildings.map(function (b) {
      return '<option' + (b === selected ? ' selected' : '') + '>' + esc(b) + '</option>';
    }).join('');
  }
  function venueFacts(v) {
    var out = [];
    if (v.capacity) out.push('<span class="badge"><i class="ph-bold ph-users" aria-hidden="true"></i>' + v.capacity + '</span>');

  function findProblem(q) {

        (timeText || notes.length ? '<p class="muted small">' + esc([timeText ? 'Showing rooms ' + timeText : ''].concat(notes).filter(Boolean).join('. ')) + '.</p>' : '') + '</div>' +
        '<label class="sort"><span class="muted small">Sort</span><select class="input input-sm" id="findSort">' +

            return '<option value="' + o[0] + '"' + (sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';

  // ---------- schedule ----------

  function showSchedule(result) {
    var v = venueByKey[key(result.venue)] || { name: result.venue };
    var start = result.startDate || state.schedule.startDate;
    var open = B.hours.openingMinute, close = B.hours.closingMinute;
    var total = 0;
    var agenda = (result.days || []).map(function (day) {
      var items = day.items.slice().sort(function (a, b) { return (b.allDay - a.allDay) || a.start - b.start || a.end - b.end; });
      total += items.length;
      var blocked = items.some(function (e) { return e.allDay; });
      var rows = [];
      // Free gaps: walk the bookings in order and only count time inside operating hours.
      var cursor = open;
      if (day.date === B.today) cursor = Math.max(cursor, Math.ceil((B.nowMinute + 5) / 15) * 15);
      if (day.date < B.today) cursor = close;
      var pastClose = day.date < B.today || cursor >= close;
      items.forEach(function (e) {
        if (!e.allDay && !blocked) {
          var gapEnd = Math.min(e.start, close);
          if (gapEnd - cursor >= 30) rows.push(freeRow(day.date, cursor, gapEnd));
          cursor = Math.max(cursor, Math.min(e.end, 1440));
        }
        rows.push(agendaRow(eventTime(e), e));
      });
      if (!blocked && close - cursor >= 30) rows.push(freeRow(day.date, cursor, close));
      var summary = blocked ? 'Booked all day' : !items.length ? (pastClose ? 'Closed for today' : 'No bookings') : plural(items.length, 'booking');
      return '<div class="day-group"><div class="day-title">' + esc(dayLabel(day.date)) + '<span class="muted small"> · ' + esc(summary) + '</span></div><div class="panel">' +
        (rows.join('') || '<div class="agenda-item"><span class="muted">' + (pastClose ? 'Operating hours are over for today.' : 'Nothing to show.') + '</span></div>') + '</div></div>';
    }).join('');

    if (e.startsEarlier && e.endsLater) return 'All day (multi-day)';
    if (e.startsEarlier) return 'Until ' + end + ' (from the day before)';

            : (!ACCOUNT.accessReady
              ? '<div class="panel access-card">' + emptyState(ART.lock, 'Pro keys aren\'t open yet', 'Check back soon.') + '</div>'
              : '<form class="panel access-card" id="redeemForm"' + postAttrs('redeemKey') + '><h2 style="font-size:24px">Have a key?</h2>' +
                  '<div class="key-box"><input class="input key" id="keyInput" name="key" placeholder="HEVX-XXXX-XXXX-XXXX" maxlength="19" autocomplete="off" spellcheck="false" aria-label="Access key">' +
                  '<button class="btn btn-lemon" type="submit">Unlock Pro</button></div>' +
                  '<p class="hint">Keys are tied to one account. A key sent to you only works with ' + esc(ACCOUNT.email) + '.</p>' +
                  '<p class="error-text" id="redeemError" hidden></p></form>' +
                '<form class="panel access-card" id="requestForm"' + (requestUsed ? '' : postAttrs('requestAccess')) + '><h2 style="font-size:24px">Request a key</h2>' +
                  (requestUsed ? '<p class="muted">You sent a request today. If it\'s approved, the key is emailed to ' + esc(ACCOUNT.email) + '.</p>' :
                  '<p class="muted">Tell us who you book for. Approved keys are emailed to ' + esc(ACCOUNT.email) + '.</p>' +
                  '<div class="form-grid">' +
                    '<label class="field"><span>Your name</span><input class="input" name="name" maxlength="80" required></label>' +
                    '<label class="field"><span>Organization</span><input class="input" name="organization" maxlength="120" required></label>' +
                    '<label class="field"><span>Role <span class="muted">(optional)</span></span><input class="input" name="role" maxlength="80" placeholder="e.g. Logistics head"></label>' +
                    '<label class="field"><span>Contact number <span class="muted">(optional)</span></span><input class="input" name="contact" maxlength="30" inputmode="tel"></label>' +
                    '<label class="field wide"><span>What will you use Pro for?</span><textarea class="input" name="purpose" maxlength="600" required placeholder="e.g. Weekly GA bookings and event planning for the org"></textarea></label>' +
                    '<label style="position:absolute;left:-9999px" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>' +
                  '</div>' +
                  '<div><button class="btn btn-primary" type="submit"><i class="ph-bold ph-paper-plane-tilt" aria-hidden="true"></i>Send request</button></div>' +
                  '<p class="error-text" id="requestError" hidden></p>') +
                '</form>')) +
        '</div>' +
      '</div>' +
      '<h2 class="section-title" style="margin-top:56px">Compare plans</h2>' + planCards() +
    '</div></div>';

    var keyInput = $('#keyInput');
    if (keyInput) {
      keyInput.addEventListener('input', function () {
        // Group what was typed in fours; the server adds the HEVX prefix if it is missing.
        var raw = keyInput.value.toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0, 16);
        keyInput.value = raw ? raw.match(/.{1,4}/g).join('-') : '';
      });
      $('#redeemForm').addEventListener('submit', function (e) {
        // A normal page post: it works even when several Google accounts are signed in.
        var err = $('#redeemError');
        if (keyInput.value.replace(/[^0-9A-Z]/gi, '').length < 12) {
          e.preventDefault();
          err.textContent = 'Enter the whole key, like HEVX-XXXX-XXXX-XXXX.'; err.hidden = false;
          agi.react('invalid', 'That key looks too short.');
          return;
        }
        busy($('#redeemForm button[type=submit]'), 'Checking…');
        agi.react('loading', 'Checking your key…');
      });
    }
    var reqForm = $('#requestForm');
    if (reqForm && reqForm.purpose) {
      reqForm.addEventListener('submit', function (e) {
        var err = $('#requestError');
        var missing = ['name', 'organization', 'purpose'].filter(function (n) { return !reqForm[n].value.trim(); });
        if (missing.length) {
          e.preventDefault();
          err.textContent = 'Fill in your name, organization and what you need Pro for.'; err.hidden = false;
          reqForm[missing[0]].focus();
          agi.react('locked', 'A few fields are still empty.');
          return;
        }
        err.hidden = true;
        busy($('#requestForm button[type=submit]'), 'Sending…');
        agi.react('loading', 'Sending your request…');
      });
    }
    showFlash();
  }
  function postAttrs(action) {
    return ' method="post" action="' + esc(B.execUrl) + '" target="_top" accept-charset="UTF-8">' +
      '<input type="hidden" name="action" value="' + action + '"><input type="hidden" name="token" value="' + esc(B.formToken || '') + '"';
  }
  function busy(btn, text) {
    // Disable after the submit has started, or the browser drops the post.
    setTimeout(function () { btn.disabled = true; btn.lastChild.textContent = text; }, 0);
  }
  // Result of a form post, shown once after the page reloads.
  function showFlash() {
    var f = B.flash;
    if (!f) return;
    B.flash = null;
    if (f.action === 'requestAccess') {
      var form = $('#requestForm');
      if (f.ok) {
        if (form) form.innerHTML = emptyState(ART.send, 'Request sent', 'If it\'s approved, your key is emailed to ' + ACCOUNT.email + '.');
        toast('Request sent.');
        agi.react('sent');
      } else if (form) {
        if (form.purpose && f.form) Object.keys(f.form).forEach(function (n) { if (form[n]) form[n].value = f.form[n]; });
        var err = $('#requestError');
        if (err) { err.textContent = f.message; err.hidden = false; }
        else form.insertAdjacentHTML('beforeend', '<p class="error-text">' + esc(f.message) + '</p>');
        agi.react('error', 'That request didn\'t go through.');
      }
    } else if (f.action === 'redeemKey') {
      if (f.ok) { toast('Pro unlocked. Your key is tied to ' + ACCOUNT.email + '.'); agi.react('pro'); }
      else {
        var rErr = $('#redeemError');
        if (rErr) { rErr.textContent = f.message; rErr.hidden = false; }
        agi.react('error', 'That key didn\'t work.');
      }
    }
  }

  // ---------- report an issue ----------
  function browserSummary() {
    var ua = navigator.userAgent, name = 'Browser', os = '';
    var m = /Edg\/(\d+)/.exec(ua) || null;
    if (m) name = 'Edge ' + m[1];
    else if ((m = /(?:Chrome|CriOS)\/(\d+)/.exec(ua))) name = 'Chrome ' + m[1];
    else if ((m = /(?:Firefox|FxiOS)\/(\d+)/.exec(ua))) name = 'Firefox ' + m[1];
    else if ((m = /Version\/(\d+).*Safari/.exec(ua))) name = 'Safari ' + m[1];
    os = /iPhone|iPad/.test(ua) ? 'iOS' : /Android/.test(ua) ? 'Android' : /Mac OS X/.test(ua) ? 'macOS' : /Windows/.test(ua) ? 'Windows' : /Linux/.test(ua) ? 'Linux' : '';
    return name + (os ? ' on ' + os : '');
  }
  function renderReport() {
    var s = state.report, kinds = (B.issues && B.issues.kinds) || {}, pages = (B.issues && B.issues.pages) || ROUTE_NAMES;
    var page = s.page || s.from || '';
    var icons = { bug: 'ph-bug', data: 'ph-buildings', form: 'ph-clipboard-text', idea: 'ph-lightbulb', other: 'ph-chat-circle-dots' };
    var screen = window.screen ? window.screen.width + 'x' + window.screen.height : '';
    main.innerHTML = '<div class="page"><div class="wrap">' +
      '<div class="page-head"><div><h1>Report an issue</h1>' +
        '<p>Something broken, a room with wrong details, or an idea? It goes straight to the person who runs this site.</p></div></div>' +
      '<div class="report-grid">' +
        '<form class="panel report-form" id="reportForm"' + postAttrs('reportIssue') + '>' +
          '<fieldset class="kind-pick"><legend>What kind of issue?</legend><div class="kind-grid">' +
            Object.keys(kinds).map(function (k) {
              return '<label class="kind-opt"><input type="radio" name="kind" value="' + k + '"' + (s.kind === k ? ' checked' : '') + '>' +
                '<span><i class="ph-bold ' + (icons[k] || 'ph-chat-circle-dots') + '" aria-hidden="true"></i>' + esc(kinds[k]) + '</span></label>';
            }).join('') + '</div></fieldset>' +
          '<label class="field"><span>Where did it happen?</span><select class="input" name="page">' +
            Object.keys(pages).map(function (p) { return '<option value="' + esc(p) + '"' + (p === page ? ' selected' : '') + '>' + esc(pages[p]) + '</option>'; }).join('') +
          '</select></label>' +
          '<div class="field" data-field="message"><span>What happened?</span>' +
            '<textarea class="input" name="message" rows="6" maxlength="2000" required placeholder="What you did, what you expected, and what happened instead. Room names and times help.">' + esc(s.message) + '</textarea>' +
            '<small class="hint"><span id="msgCount">0</span> / 2000</small></div>' +
          '<div class="report-toggles">' +
            '<label class="switch"><input type="checkbox" name="details" checked>Include technical details</label>' +
            '<p class="hint" id="detailsNote"></p>' +
            '<label class="switch"><input type="checkbox" name="copy" checked>Email me a copy</label>' +
          '</div>' +
          '<input type="hidden" name="browser" value="' + esc(browserSummary()) + '">' +
          '<input type="hidden" name="screen" value="' + esc(screen) + '">' +
          '<input type="hidden" name="lastError" value="' + esc(LAST_ERROR) + '">' +
          '<label style="position:absolute;left:-9999px" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>' +
          '<p class="error-text" id="reportError" hidden></p>' +
          '<div><button class="btn btn-primary" type="submit"><i class="ph-bold ph-paper-plane-tilt" aria-hidden="true"></i>Send report</button></div>' +
        '</form>' +
        '<aside class="panel report-aside">' + ART.send +
          '<h2>What happens next</h2>' +
          '<ul class="next-list">' +
            '<li><i class="ph-bold ph-envelope-simple" aria-hidden="true"></i><span>Your report is emailed to the site owner right away, with your account so they can reply.</span></li>' +
            '<li><i class="ph-bold ph-hash" aria-hidden="true"></i><span>You get a report ID. Keep it if you want to follow up.</span></li>' +
            '<li><i class="ph-bold ph-buildings" aria-hidden="true"></i><span>For a booking problem with CFMO itself, contact CFMO directly. This site only reads their calendars.</span></li>' +
          '</ul></aside>' +
      '</div></div></div>';

    var form = $('#reportForm');
    function count() { $('#msgCount').textContent = form.message.value.length; }
    function note() {
      $('#detailsNote').textContent = form.details.checked
        ? 'Adds the page, ' + browserSummary() + ', screen ' + screen + (LAST_ERROR ? ', and the last error you saw' : '') + '. No passwords or form answers.'
        : 'Only your message, the page and your account are sent.';
    }
    form.message.addEventListener('input', function () { s.message = form.message.value; count(); });
    form.details.addEventListener('change', note);
    $all('input[name=kind]', form).forEach(function (r) { r.addEventListener('change', function () { s.kind = r.value; agi.react('change'); }); });
    form.page.addEventListener('change', function () { s.page = form.page.value; });
    form.addEventListener('submit', function (e) {
      var err = $('#reportError');
      if (form.message.value.trim().length < 10) {
        e.preventDefault();
        err.textContent = 'Tell us a little more, at least a sentence.'; err.hidden = false;
        form.message.focus();
        agi.react('invalid', 'A bit more detail helps a lot.');
        return;
      }
      err.hidden = true;
      busy($('#reportForm button[type=submit]'), 'Sending…');
      agi.react('loading', 'Sending your report…');
    });
    count(); note();
    showReportFlash();
  }
  function showReportFlash() {
    var f = B.flash;
    if (!f || f.action !== 'reportIssue') return;
    B.flash = null;
    var form = $('#reportForm');
    if (f.ok) {
      state.report.message = '';
      form.outerHTML = '<div class="panel report-form">' + emptyState(ART.send, 'Report sent',
        'Thanks for flagging it. Your report ID is ' + (f.id || '') + '. If more details are needed, you will get an email.',
        '<a class="btn" href="#/" data-nav>Back to home</a>') + '</div>';
      toast('Report sent. ID ' + (f.id || ''));
      agi.react('sent', 'Sent! Thanks for helping fix things.');
    } else {
      if (f.form) {
        if (f.form.message) form.message.value = f.form.message;
        var k = form.querySelector('input[name=kind][value="' + f.form.kind + '"]'); if (k) k.checked = true;
        if (f.form.page !== undefined) form.page.value = f.form.page;
        $('#msgCount').textContent = form.message.value.length;
      }
      var err = $('#reportError'); err.textContent = f.message; err.hidden = false;
      agi.react('error', 'That report didn\'t go through.');
    }
  }

  // ---------- start ----------
  $('#footerRefresh').textContent = B.lastRefresh ? 'Venue list last synced with CFMO on ' + B.lastRefresh + '.' : '';
  $('#footerLinks').innerHTML = (ACCOUNT.plan !== 'none' ? '<a href="#/report" data-nav>Report an issue</a>' : '') + [['Venue availability (CFMO)', B.links.availability], ['Reservation forms', B.links.forms],
    ['Venue layouts', B.links.layout], ['OSA managed venues', B.links.osa]].map(function (l) {
    return '<a href="' + esc(l[1]) + '" target="_blank" rel="noopener">' + esc(l[0]) + '</a>';
  }).join('');
  drawPlanChip();

  var hour = new Date().getHours();
  setTimeout(function () {
    agi.react('hello', (hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening') + '! I\'m Agi. I keep an eye on the room calendars.');
  }, 500);
  if (B.view) show(B.view);
  else if (HISTORY && google.script.url) google.script.url.getLocation(function (loc) { show(loc.hash || ''); });
  else show(location.hash);
})();
</script>

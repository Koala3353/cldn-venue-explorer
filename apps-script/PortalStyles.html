<style>
  /*
   * Graphite and paper with one accent: a burnt orange used sparingly for
   * the primary action, the live dot and highlights. Neutrals are true greys,
   * no blue tint. Surfaces have 1px borders and soft neutral shadows. Radii:
   * inputs 12px, cards 20px, buttons and chips fully round. Mascot colours
   * live in PortalMascot. --edge is the outline colour for the illustrations;
   * UI borders use --border.
   */
  :root {
    --paper: #f5f5f4;
    --card: #ffffff;
    --sunk: #eeeeec;
    --ink: #17191c;
    --ink-2: #5a5f66;
    --edge: #17191c;
    --border: #e2e2df;
    --border-strong: #c9c9c5;
    --hair: #ebebe8;
    --shadow-c: rgba(23, 25, 28, 0.14);
    --shadow-sm: 0 1px 2px rgba(23, 25, 28, 0.05), 0 2px 6px -2px rgba(23, 25, 28, 0.07);
    --shadow-md: 0 1px 2px rgba(23, 25, 28, 0.04), 0 12px 32px -14px rgba(23, 25, 28, 0.18);
    --shadow-lg: 0 2px 4px rgba(23, 25, 28, 0.04), 0 28px 60px -24px rgba(23, 25, 28, 0.26);
    --accent: #c94a0a;
    --accent-ink: #ffffff;
    --accent-soft: #fbe9df;
    --accent-text: #a63c07;
    --hero-glow: rgba(201, 74, 10, 0.10);
    --inverse: #17191c; --inverse-ink: #f5f5f4; --inverse-line: rgba(245, 245, 244, 0.09);
    --cobalt: var(--accent); --cobalt-ink: var(--accent-ink); --cobalt-soft: var(--accent-soft); --cobalt-text: var(--accent-text);
    --ok: #17734a; --ok-soft: #e0f2e8;
    --warn: #8a5300; --warn-soft: #fbf0d9;
    --bad: #b42318; --bad-soft: #fde6e2;
    --lemon: var(--accent); --mint: var(--accent);
    --coral: #ff5d4f; --tangerine: #ff9f1c; --sky: #4cc3ff; --pink: #ff8fb8;
    --r: 12px; --r-lg: 20px;
    --lift: 0px;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-io: cubic-bezier(0.77, 0, 0.175, 1);
    --pop: cubic-bezier(0.34, 1.56, 0.64, 1);
    --display: 'Bricolage Grotesque', 'Geist', system-ui, sans-serif;
    --body: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'Geist Mono', ui-monospace, 'SF Mono', monospace;
    --z-bar: 20; --z-agi: 30; --z-toast: 40;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0e0f11; --card: #16181b; --sunk: #121316; --ink: #ededee; --ink-2: #9c9fa6;
      --edge: #c9ccd2; --border: #26292e; --border-strong: #363a40; --hair: #1d2024; --shadow-c: rgba(0, 0, 0, 0.5);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4); --shadow-md: 0 14px 36px -16px rgba(0, 0, 0, 0.7); --shadow-lg: 0 30px 70px -26px rgba(0, 0, 0, 0.85);
      --accent: #ff7a3d; --accent-ink: #14100d; --accent-soft: #2a1a12; --accent-text: #ff9b6b; --hero-glow: rgba(255, 122, 61, 0.14);
      --inverse: #1c1f23; --inverse-ink: #ededee; --inverse-line: rgba(237, 237, 238, 0.07);
      --ok: #5fd4a0; --ok-soft: #0f2a1f; --warn: #f2c063; --warn-soft: #2f240e; --bad: #ff8a7f; --bad-soft: #3a1714;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0e0f11; --card: #16181b; --sunk: #121316; --ink: #ededee; --ink-2: #9c9fa6;
    --edge: #c9ccd2; --border: #26292e; --border-strong: #363a40; --hair: #1d2024; --shadow-c: rgba(0, 0, 0, 0.5);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4); --shadow-md: 0 14px 36px -16px rgba(0, 0, 0, 0.7); --shadow-lg: 0 30px 70px -26px rgba(0, 0, 0, 0.85);
    --accent: #ff7a3d; --accent-ink: #14100d; --accent-soft: #2a1a12; --accent-text: #ff9b6b; --hero-glow: rgba(255, 122, 61, 0.14);
    --inverse: #1c1f23; --inverse-ink: #ededee; --inverse-line: rgba(237, 237, 238, 0.07);
    --ok: #5fd4a0; --ok-soft: #0f2a1f; --warn: #f2c063; --warn-soft: #2f240e; --bad: #ff8a7f; --bad-soft: #3a1714;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; background: var(--paper); color: var(--ink);
    font: 15px/1.55 var(--body); -webkit-font-smoothing: antialiased; transition: background-color 300ms ease, color 300ms ease; }
  main { flex: 1; outline: none; }
  a { color: var(--cobalt-text); }
  h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 800; letter-spacing: -0.025em; line-height: 1.08; }
  p { margin: 0; }
  .muted { color: var(--ink-2); }
  .small { font-size: 13px; }
  .mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .wrap { width: 100%; max-width: 1160px; margin: 0 auto; padding: 0 24px; }
  .skip { position: absolute; left: -999px; top: 8px; z-index: 99; background: var(--card); padding: 8px 12px; border: 2px solid var(--edge); border-radius: var(--r); }
  .skip:focus { left: 8px; }
  :focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }

  /* Top bar */
  .topbar { position: sticky; top: 0; z-index: var(--z-bar); background: var(--paper); border-bottom: 2px solid var(--edge); }
  .topbar-inner { max-width: 1160px; margin: 0 auto; padding: 0 24px; height: 64px; display: flex; align-items: center; gap: 20px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .brand-mark { width: 34px; height: 34px; }
  .brand-name { font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: -0.03em; white-space: nowrap; }
  .nav { display: flex; gap: 6px; flex: 1; }
  .nav a { padding: 7px 13px; border-radius: 99px; color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14px;
    border: 2px solid transparent; transition: background-color 150ms ease, border-color 150ms ease; }
  .nav a[aria-current="page"] { background: var(--ink); color: var(--paper); }
  @media (hover: hover) and (pointer: fine) { .nav a:not([aria-current="page"]):hover { border-color: var(--edge); } }
  .topbar-actions { display: flex; align-items: center; gap: 10px; }
  .plan-chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 2px solid var(--edge); border-radius: 99px;
    font-weight: 700; font-size: 13px; color: var(--ink); text-decoration: none; background: var(--card); white-space: nowrap; }
  .plan-chip .tag { font-family: var(--mono); font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--ink); color: var(--paper); }
  .plan-chip.pro .tag { background: var(--lemon); color: #17171c; }
  .icon-btn { width: 36px; height: 36px; border-radius: 99px; border: 2px solid var(--edge); background: var(--card); color: var(--ink);
    display: grid; place-items: center; cursor: pointer; font-size: 16px; transition: transform 120ms var(--ease); }
  .icon-btn:active { transform: scale(0.92); }

  /* Account menu */
  .acct { position: relative; }
  .acct-btn { width: 36px; height: 36px; border-radius: 99px; border: 2px solid var(--edge); background: var(--cobalt); color: var(--cobalt-ink);
    font: 800 15px/1 var(--display); cursor: pointer; display: grid; place-items: center; transition: transform 120ms var(--ease); }
  .acct-btn:active { transform: scale(0.92); }
  .acct-btn:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }
  .acct-btn[aria-expanded="true"] { box-shadow: 0 0 0 4px var(--cobalt-soft); }
  .acct-menu { position: absolute; right: 0; top: calc(100% + 10px); width: 290px; max-width: calc(100vw - 24px); padding: 8px; z-index: var(--z-toast);
    background: var(--card); border: 2px solid var(--edge); border-radius: var(--r-lg); box-shadow: 4px 4px 0 var(--shadow-c);
    transform-origin: top right; animation: menuIn 160ms var(--ease); }
  @keyframes menuIn { from { opacity: 0; transform: scale(0.96) translateY(-4px); } }
  .acct-head { padding: 8px 10px 12px; margin-bottom: 6px; border-bottom: 1.5px dashed var(--hair); display: grid; gap: 4px; }
  .acct-head .muted { font-size: 12px; }
  .acct-email { font-weight: 700; font-size: 14px; overflow-wrap: anywhere; }
  .acct-plan { justify-self: start; font: 600 11px var(--mono); padding: 1px 8px; border-radius: 99px; background: var(--ink); color: var(--paper); }
  .acct-plan.pro { background: var(--lemon); color: #17171c; }
  .acct-item { display: flex; gap: 10px; align-items: center; width: 100%; padding: 10px; border: 0; border-radius: var(--r); background: none;
    color: var(--ink); font: 600 14px var(--body); text-decoration: none; text-align: left; cursor: pointer; }
  .acct-item i { font-size: 18px; }
  .acct-item:hover, .acct-item:focus-visible { background: var(--sunk); outline: none; }
  .acct-item.danger { color: var(--bad); }
  .acct-item.armed { background: var(--bad-soft); }
  .acct-note { padding: 2px 10px 8px; font-size: 12px; color: var(--ink-2); }
  .gate-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  /* Buttons: a solid shadow that collapses on press */
  .btn { --s: var(--lift); display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px;
    border-radius: var(--r); border: 2px solid var(--edge); background: var(--card); color: var(--ink); font: 700 14px var(--body);
    text-decoration: none; cursor: pointer; white-space: nowrap; box-shadow: var(--s) var(--s) 0 var(--shadow-c);
    transition: transform 120ms var(--ease), box-shadow 120ms var(--ease), background-color 150ms ease; }
  .btn:active { transform: translate(var(--s), var(--s)); box-shadow: 0 0 0 var(--shadow-c); }
  .btn-primary { background: var(--cobalt); color: var(--cobalt-ink); }
  .btn-lemon { background: var(--lemon); color: #17171c; }
  .btn-danger { background: var(--coral); color: #17171c; }
  .btn-sm { height: 36px; padding: 0 13px; font-size: 13px; --s: 2px; }
  .btn[disabled] { opacity: .55; cursor: not-allowed; transform: none; }
  @media (hover: hover) and (pointer: fine) {
    .btn:not([disabled]):hover { transform: translate(-1px, -1px); box-shadow: calc(var(--s) + 1px) calc(var(--s) + 1px) 0 var(--shadow-c); }
    .btn:not([disabled]):active { transform: translate(var(--s), var(--s)); box-shadow: 0 0 0 var(--shadow-c); }
  }
  .link-btn { background: none; border: 0; padding: 0; color: var(--cobalt-text); font: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

  /* Forms */
  .field { display: grid; gap: 6px; min-width: 0; }
  .field > span, .label { font-size: 13px; font-weight: 700; }
  .hint { font-size: 12px; color: var(--ink-2); }
  input[type="date"].input, input[type="time"].input { -webkit-appearance: none; appearance: none; min-width: 0; display: block; line-height: 40px; }
  .input { min-width: 0; }
  .input { width: 100%; height: 44px; padding: 0 12px; border: 2px solid var(--edge); border-radius: var(--r); background: var(--card);
    color: var(--ink); font: 15px var(--body); transition: border-color 150ms ease, box-shadow 150ms ease; }
  textarea.input { height: auto; min-height: 96px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
  .input::placeholder { color: var(--ink-2); opacity: .75; }
  .input:focus { outline: none; border-color: var(--cobalt); box-shadow: 0 0 0 4px var(--cobalt-soft); }
  .input.key { font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase; }
  .switch { display: inline-flex; align-items: center; gap: 10px; height: 44px; cursor: pointer; font-weight: 700; font-size: 13px; }
  .switch input { appearance: none; margin: 0; width: 42px; height: 24px; border-radius: 99px; border: 2px solid var(--edge); background: var(--sunk);
    position: relative; cursor: pointer; transition: background-color 160ms ease; }
  .switch input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink);
    transition: transform 200ms var(--pop); }
  .switch input:checked { background: var(--mint); }
  .switch input:checked::after { transform: translateX(18px); background: #17171c; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px; }
  .check-chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border: 2px solid var(--edge); border-radius: 99px;
    cursor: pointer; font-weight: 600; font-size: 14px; user-select: none; transition: background-color 150ms ease; }
  .check-chip input { accent-color: var(--cobalt); margin: 0; }
  .check-chip:has(input:checked) { background: var(--cobalt-soft); }
  .checks-col { display: grid; gap: 8px; }
  .checks-col .check-chip { border-radius: var(--r); align-items: flex-start; padding: 10px 12px; }
  .checks-col .check-chip input { margin-top: 3px; flex: none; }
  .checks-col .check-chip small { display: block; font-weight: 500; font-size: 12.5px; margin-top: 2px; }
  .field .input + .input, .field .checks + .input { margin-top: 8px; }
  .field.has-error .checks-col .check-chip { border-color: var(--bad); }
  .intake { display: grid; gap: 8px; font-size: 13px; color: var(--ink-2); }
  .intake:empty { display: none; }
  .intake p { display: flex; gap: 8px; align-items: flex-start; }
  .intake i { font-size: 16px; margin-top: 1px; flex: none; }
  .intake.open p:first-child { color: var(--ok); font-weight: 600; }
  .intake .late-note { color: var(--warn); font-weight: 600; background: var(--warn-soft); border-radius: var(--r); padding: 10px; }
  .link-notes { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); }

  /* Surfaces */
  .panel { background: var(--card); border: 2px solid var(--edge); border-radius: var(--r-lg); box-shadow: 4px 4px 0 var(--shadow-c); }
  .panel-flat { background: var(--card); border: 2px solid var(--edge); border-radius: var(--r-lg); }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 99px; border: 2px solid var(--edge);
    background: var(--card); color: var(--ink); font: 600 13px var(--body); white-space: nowrap; }
  button.chip { cursor: pointer; transition: transform 120ms var(--ease), background-color 150ms ease; }
  button.chip:active { transform: scale(0.95); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .chip-slot { font-family: var(--mono); font-size: 12.5px; background: var(--cobalt-soft); color: var(--cobalt-text); border-color: var(--cobalt); }
  @media (hover: hover) and (pointer: fine) { button.chip-slot:hover { background: var(--cobalt); color: var(--cobalt-ink); } }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px;
    border: 1.5px solid var(--hair); color: var(--ink-2); background: var(--card); }
  .badge-ok { border-color: transparent; background: var(--ok-soft); color: var(--ok); }
  .badge-lock { border-color: transparent; background: var(--lemon); color: #17171c; }

  /* Custom loader: a 3x3 slot grid that lights up cell by cell */
  .loader { display: grid; justify-items: center; gap: 14px; padding: 44px 20px; text-align: center; }
  .loader svg { width: 64px; height: 64px; }
  .loader rect { fill: var(--sunk); stroke: var(--edge); stroke-width: 2.5; transform-box: fill-box; transform-origin: center;
    animation: slotPulse 1.35s var(--ease) infinite; animation-delay: calc(var(--d) * 110ms); }
  @keyframes slotPulse { 0%, 55%, 100% { fill: var(--sunk); transform: scale(1); } 20% { fill: var(--cobalt); transform: scale(0.82); } }
  .loader p { font-weight: 600; }

  /* Landing */
  .hero { padding: 56px 0 64px; }
  .hero-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 56px; align-items: center; }
  .hero h1 { font-size: clamp(42px, 6.2vw, 76px); max-width: 14ch; }
  .squiggle { position: relative; display: inline-block; white-space: nowrap; }
  .squiggle svg { position: absolute; left: -2%; bottom: -0.16em; width: 104%; height: 0.32em; overflow: visible; }
  .squiggle path { stroke: var(--cobalt); stroke-width: 7; fill: none; stroke-linecap: round; stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 900ms 250ms var(--ease) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .lead { font-size: 18px; color: var(--ink-2); max-width: 42ch; margin-top: 20px; }
  .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }

  .board { padding: 0; overflow: hidden; }
  .board-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; background: var(--ink); color: var(--paper); }
  .board-head h2 { font-size: 18px; letter-spacing: -0.01em; }
  .live { display: inline-flex; align-items: center; gap: 7px; font: 600 12px var(--mono); }
  .live::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--mint); animation: livePulse 2s ease-in-out infinite; }
  @keyframes livePulse { 50% { opacity: .35; } }
  .board-count { padding: 16px 18px 6px; display: flex; align-items: baseline; gap: 10px; }
  .board-count strong { font: 800 46px/1 var(--display); letter-spacing: -0.04em; }
  .board-list { display: grid; padding: 6px 8px 10px; }
  .board-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px; border-radius: var(--r); border: 0; width: 100%;
    background: transparent; text-align: left; color: inherit; font: inherit; cursor: pointer; transition: background-color 150ms ease; }
  .board-row + .board-row { border-top: 1.5px dashed var(--hair); border-radius: 0; }
  @media (hover: hover) and (pointer: fine) { .board-row:hover { background: var(--cobalt-soft); border-radius: var(--r); } }
  .board-row strong { font-weight: 700; }
  .board-row .until { font: 600 13px var(--mono); }

  .section { padding: 72px 0; }
  .section-title { font-size: clamp(30px, 3.6vw, 44px); max-width: 18ch; }
  .section-lead { color: var(--ink-2); margin-top: 12px; max-width: 54ch; font-size: 16px; }
  .flow { display: grid; grid-template-columns: 0.85fr 1.15fr; gap: 56px; align-items: start; }
  .flow-list { display: grid; gap: 14px; list-style: none; margin: 0; padding: 0; }
  .flow-item { display: grid; grid-template-columns: 72px 1fr; gap: 18px; align-items: center; padding: 16px; }
  .flow-item svg { width: 72px; height: 72px; }
  .flow-item h3 { font-size: 21px; margin-bottom: 4px; }

  .bento { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 150px; gap: 16px; margin-top: 32px; }
  .tile { display: flex; flex-direction: column; justify-content: space-between; padding: 18px; text-align: left; font: inherit; color: #17171c;
    border: 2px solid var(--edge); border-radius: var(--r-lg); box-shadow: 4px 4px 0 var(--shadow-c); cursor: pointer;
    transition: transform 140ms var(--ease), box-shadow 140ms var(--ease); }
  .tile:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--shadow-c); }
  @media (hover: hover) and (pointer: fine) { .tile:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--shadow-c); } }
  .tile .count { font: 800 44px/1 var(--display); letter-spacing: -0.04em; }
  .tile .label { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
  .tile-big { grid-column: span 2; grid-row: span 2; background: var(--cobalt); color: #fff; }
  .tile-big .count { font-size: 96px; }
  .tile-lemon { background: var(--lemon); } .tile-mint { background: var(--mint); } .tile-pink { background: var(--pink); }
  .tile-grid { background-color: var(--card); color: var(--ink);
    background-image: linear-gradient(var(--hair) 1.5px, transparent 1.5px), linear-gradient(90deg, var(--hair) 1.5px, transparent 1.5px);
    background-size: 22px 22px; }

  .plans { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 32px; align-items: stretch; }
  .plan { padding: 26px; display: grid; gap: 14px; align-content: start; }
  .plan h3 { font-size: 28px; display: flex; align-items: center; gap: 10px; }
  .plan ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .plan li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; }
  .plan li i { font-size: 18px; margin-top: 2px; }
  .plan-pro { background: var(--ink); color: var(--paper); }
  .plan-pro .muted { color: color-mix(in srgb, var(--paper) 70%, transparent); }
  .plan-pro li i { color: var(--lemon); }

  /* App pages */
  .page { padding: 36px 0 80px; }
  .page-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .page-head h1 { font-size: clamp(32px, 4vw, 46px); }
  .page-head p { color: var(--ink-2); margin-top: 8px; max-width: 64ch; }
  .meter { display: inline-flex; align-items: center; gap: 8px; font: 600 13px var(--body); }
  .meter .cells { display: inline-flex; gap: 3px; }
  .meter .cells span { width: 10px; height: 10px; border-radius: 3px; border: 1.5px solid var(--edge); background: var(--card); }
  .meter .cells span.used { background: var(--ink); }
  .find-form { padding: 16px; display: grid; gap: 12px; }
  .filters { display: grid; grid-template-columns: 1.2fr 1.2fr 1.3fr 1.4fr 0.9fr 1fr 0.8fr auto; gap: 12px; align-items: end; }

  .sort { display: flex; align-items: center; gap: 8px; }
  .input-sm { height: 36px; font-size: 14px; padding: 0 10px; width: auto; }
  .chip-len { font: 600 11px var(--mono); color: var(--ink-2); padding-left: 6px; margin-left: 2px; border-left: 1.5px solid var(--hair); }

  /* Find: more options */
  details.more { border-top: 1.5px dashed var(--hair); padding-top: 12px; }
  details.more > summary { list-style: none; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 700; font-size: 14px;
    padding: 6px 10px; margin-left: -10px; border-radius: var(--r); }
  details.more > summary::-webkit-details-marker { display: none; }

  details.more > summary .caret { transition: transform 200ms var(--ease); }
  details.more[open] > summary .caret { transform: rotate(180deg); }
  .more-count:not(:empty) { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--cobalt); color: var(--cobalt-ink);
    font: 700 12px/20px var(--body); text-align: center; }
  .more-grid { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1.4fr; gap: 12px 12px; align-items: end; margin-top: 12px; }
  .more-grid .time-hint { grid-column: 1 / -1; margin-top: -4px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 2px solid var(--edge); border-radius: var(--r); overflow: hidden; height: 44px; }
  .seg-opt { position: relative; display: grid; cursor: pointer; }
  .seg-opt + .seg-opt { border-left: 2px solid var(--edge); }
  .seg-opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .seg-opt span { display: grid; place-items: center; padding: 0 6px; font: 700 13px var(--body); white-space: nowrap; transition: background-color 150ms ease, color 150ms ease; }
  .seg-opt input:checked + span { background: var(--ink); color: var(--paper); }
  .seg-opt input:focus-visible + span { outline: 3px solid var(--cobalt); outline-offset: -5px; }
  .input:disabled { opacity: .45; cursor: not-allowed; }
  .input[aria-invalid="true"] { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
  .field-error { color: var(--bad); font-size: 12.5px; font-weight: 600; line-height: 1.35; }
  .day-group + .day-group { margin-top: 30px; }
  .day-title { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font: 800 16px var(--display); }
  .day-title::after { content: ''; flex: 1; height: 2px; background: var(--edge); }
  .venue-row { display: grid; grid-template-columns: minmax(170px, 230px) 1fr; gap: 16px; align-items: center; padding: 14px 16px; }
  .venue-row + .venue-row { border-top: 1.5px dashed var(--hair); }
  .venue-row h3 { font: 700 16px var(--body); letter-spacing: 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; color: var(--ink-2); font-size: 13px; }
  .slot-list { display: flex; flex-wrap: wrap; gap: 8px; }

  .schedule-grid { display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; }
  .spec-card { padding: 20px; position: sticky; top: 88px; }
  .spec-card h2 { font-size: 26px; }

  .spec-list dt { color: var(--ink-2); }

  .agenda-item { display: grid; grid-template-columns: 170px 1fr; gap: 16px; padding: 14px 16px; }
  .agenda-item + .agenda-item { border-top: 1.5px dashed var(--hair); }
  .agenda-time { font: 600 13px var(--mono); padding-top: 2px; }
  .agenda-desc { color: var(--ink-2); font-size: 13px; margin-top: 3px; white-space: pre-line; }
  .agenda-free { background: var(--cobalt-soft); }
  .agenda-free .agenda-time { color: var(--cobalt-text); }

  .venue-tools { padding: 16px; display: grid; grid-template-columns: 1.5fr 1fr 0.8fr auto; gap: 12px; align-items: end; }
  .type-pills { display: flex; gap: 8px; overflow-x: auto; padding: 16px 2px 6px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .type-pills::-webkit-scrollbar { display: none; }
  .type-pills .chip { scroll-snap-align: start; }
  .venue-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; margin-top: 18px; }
  .venue-card { padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 3px 3px 0 var(--shadow-c); }
  .venue-card h3 { font-size: 20px; }
  .venue-card .actions { display: flex; gap: 8px; margin-top: auto; }

  .book-grid { display: grid; grid-template-columns: 1fr 380px; gap: 24px; align-items: start; }
  .form-panel { padding: 24px; display: grid; gap: 26px; }
  .form-section h2 { font-size: 22px; margin-bottom: 14px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid .wide { grid-column: 1 / -1; }
  .profile-bar { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: end; }
  details.requester > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px; border: 2px solid var(--edge); border-radius: var(--r); font-weight: 700; }
  details.requester > summary::-webkit-details-marker { display: none; }
  details.requester > summary i { transition: transform 200ms var(--ease); }
  details.requester[open] > summary i { transform: rotate(180deg); }
  details.requester .form-grid { margin-top: 14px; }
  .summary-card { padding: 20px; position: sticky; top: 88px; display: grid; gap: 16px; }
  .status { border-radius: var(--r); padding: 14px; font-size: 14px; border: 2px solid var(--edge); background: var(--sunk); }
  .status strong { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 15px; }
  .status.free { background: var(--ok-soft); } .status.free strong { color: var(--ok); }
  .status.conflict, .status.error { background: var(--bad-soft); } .status.conflict strong, .status.error strong { color: var(--bad); }
  .status.unknown, .status.blocked { background: var(--warn-soft); } .status.unknown strong, .status.blocked strong { color: var(--warn); }
  .status ul { margin: 6px 0 0; padding-left: 18px; }
  .status .slot-list { margin-top: 10px; }
  .link-box { display: grid; gap: 10px; }
  .link-box textarea { width: 100%; height: 86px; resize: none; padding: 10px; border: 2px solid var(--edge); border-radius: var(--r);
    background: var(--sunk); color: var(--ink); font: 11.5px/1.45 var(--mono); }
  .locked { display: grid; gap: 12px; padding: 16px; border: 2px dashed var(--edge); border-radius: var(--r); background: var(--sunk); }
  .locked h3 { font-size: 18px; display: flex; gap: 8px; align-items: center; }
  .error-text { color: var(--bad); font-size: 13px; font-weight: 700; }

  .access-grid { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 24px; align-items: start; }
  .access-card { padding: 24px; display: grid; gap: 16px; }
  .usage-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1.5px dashed var(--hair); }
  .key-box { display: grid; grid-template-columns: 1fr auto; gap: 10px; }

  /* States */
  .empty { padding: 40px 24px; display: grid; justify-items: center; gap: 10px; text-align: center; }
  .empty svg { width: 112px; height: 112px; }
  .empty h3 { font-size: 22px; }
  .empty p { color: var(--ink-2); max-width: 46ch; }

  /* Toasts */
  .toast-region { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: var(--z-toast); display: grid; gap: 8px; width: min(420px, calc(100% - 32px)); }
  .toast { padding: 12px 16px; border-radius: var(--r); background: var(--ink); color: var(--paper); font-weight: 600; font-size: 14px;
    border: 2px solid var(--edge); box-shadow: 3px 3px 0 var(--shadow-c); transition: opacity 220ms ease, transform 220ms var(--ease); }
  @starting-style { .toast { opacity: 0; transform: translateY(10px); } }

  .view-enter { animation: viewIn 240ms var(--ease); }
  @keyframes viewIn { from { opacity: 0; transform: translateY(8px); } }
  .stagger > * { animation: viewIn 280ms var(--ease) both; animation-delay: calc(min(var(--i, 0), 10) * 35ms); }

  /* Footer */
  .footer { border-top: 2px solid var(--edge); padding: 32px 0 40px; }
  .footer-inner { max-width: 1160px; margin: 0 auto; padding: 0 24px; display: flex; justify-content: space-between; gap: 32px; flex-wrap: wrap; }
  .footer-about { display: grid; gap: 6px; max-width: 54ch; justify-items: start; }
  .footer-title { font: 800 18px var(--display); }
  .credits { font-size: 14px; }
  .credits strong { font-weight: 700; }
  .footer-links { display: grid; grid-template-columns: repeat(2, auto); gap: 8px 28px; align-content: start; font-size: 14px; }
  .footer-links a { color: var(--ink); font-weight: 600; text-decoration: none; }
  @media (hover: hover) and (pointer: fine) { .footer-links a:hover { text-decoration: underline; } }

  /* Mobile tab bar */
  .tabbar { display: none; }

  @media (max-width: 960px) {
    .hero-grid, .flow, .schedule-grid, .book-grid, .access-grid, .plans { grid-template-columns: 1fr; }
    .filters, .filters.single { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .filters .btn { grid-column: 1 / -1; }
    .more-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .more-grid .time-mode { grid-column: 1 / -1; }
    .bento { grid-template-columns: repeat(2, 1fr); }
    .venue-tools { grid-template-columns: 1fr 1fr; }
    .spec-card, .summary-card { position: static; }
    .hero { padding: 36px 0 48px; }
  }
  @media (max-width: 720px) {
    .wrap, .topbar-inner, .footer-inner { padding: 0 16px; }
    .nav, .brand-name { display: none; }
    .topbar-inner { justify-content: space-between; height: 58px; }
    .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--z-bar);
      background: var(--paper); border-top: 2px solid var(--edge); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
    .tabbar a { display: grid; justify-items: center; gap: 2px; padding: 6px 0; border-radius: var(--r); color: var(--ink-2); text-decoration: none; font-size: 11px; font-weight: 700; }
    .tabbar a i { font-size: 21px; }
    .tabbar a[aria-current="page"] { color: var(--ink); background: var(--cobalt-soft); }
    body { padding-bottom: calc(68px + env(safe-area-inset-bottom)); }
    .toast-region { bottom: calc(84px + env(safe-area-inset-bottom)); }
    .venue-row, .agenda-item { grid-template-columns: 1fr; gap: 8px; }
    .form-grid { grid-template-columns: 1fr; }
    .profile-bar { grid-template-columns: 1fr auto; }
    .profile-bar .link-btn { grid-column: 1 / -1; justify-self: start; }
    .bento { grid-auto-rows: 128px; gap: 12px; }
    .tile-big .count { font-size: 64px; }
    .section { padding: 48px 0; }
    .hero h1 { font-size: 42px; }
    .key-box { grid-template-columns: 1fr; }
    .more-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .results-head { align-items: flex-start; }
    .chip { white-space: normal; height: auto; min-height: 32px; padding: 4px 12px; }
    .footer-links { grid-template-columns: 1fr 1fr; gap: 10px 16px; }
    .footer { padding-bottom: 96px; }
    .spec-list { grid-template-columns: minmax(80px, auto) 1fr; }
    .spec-list dd { overflow-wrap: anywhere; }
    .agenda-item > div { min-width: 0; overflow-wrap: anywhere; }
    .venue-row h3, .venue-card h3, .spec-card h2 { overflow-wrap: anywhere; }
    .page-head { align-items: flex-start; }
    .meter { flex-wrap: wrap; }
  }

  /* ================= Theme v2 layer: soft surfaces, lime accent, motion ================= */
  body { background: var(--paper); }
  a { color: var(--accent-text); text-decoration-color: color-mix(in srgb, var(--accent-text) 40%, transparent); text-underline-offset: 3px; }
  h1, h2, h3 { letter-spacing: -0.035em; }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 75%, var(--ink)); outline-offset: 2px; }

  /* Top bar: translucent, floats over content */
  .topbar { background: color-mix(in srgb, var(--paper) 78%, transparent); border-bottom: 1px solid var(--border);
    backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%); }
  .nav { gap: 2px; padding: 4px; border-radius: 99px; background: var(--sunk); border: 1px solid var(--border); flex: none; margin-right: auto; }
  .nav a { border: 0; padding: 7px 15px; color: var(--ink-2); position: relative; transition: color 160ms ease, background-color 200ms var(--ease); }
  .nav a[aria-current="page"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow-sm); }
  @media (hover: hover) and (pointer: fine) { .nav a:not([aria-current="page"]):hover { color: var(--ink); border-color: transparent; } }
  .brand { margin-right: 12px; }
  .brand-mark { transition: transform 400ms var(--pop); }
  @media (hover: hover) and (pointer: fine) { .brand:hover .brand-mark { transform: rotate(-8deg) scale(1.06); } }
  .plan-chip { border: 1px solid var(--border); box-shadow: var(--shadow-sm); height: 36px; }
  .plan-chip .tag { background: var(--ink); color: var(--paper); }
  .plan-chip.pro .tag { background: var(--accent); color: var(--accent-ink); }
  .icon-btn { border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
  .acct-btn { border: 0; background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow-sm); }
  .acct-btn[aria-expanded="true"] { box-shadow: 0 0 0 4px var(--accent-soft); }
  .acct-menu { border: 1px solid var(--border); box-shadow: var(--shadow-lg); border-radius: 18px; }
  .acct-plan.pro { background: var(--accent); color: var(--accent-ink); }

  /* Buttons: pills that lift on hover and press in */
  .btn { border: 1px solid var(--border-strong); border-radius: 99px; box-shadow: var(--shadow-sm); background: var(--card); padding: 0 20px;
    position: relative; overflow: hidden; isolation: isolate;
    transition: transform 180ms var(--ease), box-shadow 220ms var(--ease), background-color 160ms ease, border-color 160ms ease; }
  .btn:active { transform: scale(0.97); box-shadow: var(--shadow-sm); }
  .btn-primary { background: var(--ink); color: var(--paper); border-color: transparent; }
  .btn-primary i, .btn-lemon i { transition: transform 220ms var(--ease); }
  .btn-lemon { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn-danger { background: var(--bad); color: #fff; border-color: transparent; }
  /* A light sweep across filled buttons on hover */
  .btn-primary::after, .btn-lemon::after { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, 0.28) 50%, transparent 70%); transform: translateX(-120%); }
  @media (hover: hover) and (pointer: fine) {
    .btn:not([disabled]):hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .btn:not([disabled]):active { transform: scale(0.97); box-shadow: var(--shadow-sm); }
    .btn-primary:not([disabled]):hover::after, .btn-lemon:not([disabled]):hover::after { transform: translateX(120%); transition: transform 700ms var(--ease); }
    .btn:not([disabled]):hover i.ph-arrow-right, .btn:not([disabled]):hover i.ph-paper-plane-tilt, .btn:not([disabled]):hover i.ph-magnifying-glass { transform: translateX(3px); }
  }
  .btn-sm { height: 36px; padding: 0 14px; }
  .link-btn { color: var(--accent-text); }

  /* Inputs */
  .input { border: 1px solid var(--border-strong); background: var(--card); border-radius: var(--r); box-shadow: inset 0 1px 0 rgba(23, 25, 28, 0.02); }
  .input:hover:not(:disabled):not(:focus) { border-color: color-mix(in srgb, var(--ink) 35%, var(--border-strong)); }
  .input:focus { border-color: var(--ink); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 55%, transparent); }
  .switch input { border: 1px solid var(--border-strong); }
  .switch input:checked { background: var(--accent); border-color: transparent; }
  .switch input:checked::after { background: var(--accent-ink); }
  .check-chip { border: 1px solid var(--border-strong); background: var(--card); transition: background-color 160ms ease, border-color 160ms ease, transform 160ms var(--ease); }
  .check-chip:active { transform: scale(0.98); }
  .check-chip input { accent-color: var(--ink); }
  .check-chip:has(input:checked) { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 70%, var(--ink)); }
  .seg { border: 1px solid var(--border-strong); border-radius: 99px; padding: 3px; background: var(--sunk); gap: 3px; height: 44px; }
  .seg-opt + .seg-opt { border-left: 0; }
  .seg-opt span { border-radius: 99px; transition: background-color 200ms var(--ease), color 160ms ease, box-shadow 200ms ease; }
  .seg-opt input:checked + span { background: var(--card); color: var(--ink); box-shadow: var(--shadow-sm); }
  details.more > summary { border-radius: 99px; }
  .more-count:not(:empty) { background: var(--accent); color: var(--accent-ink); }

  /* Surfaces */
  .panel { border: 1px solid var(--border); box-shadow: var(--shadow-md); border-radius: var(--r-lg); }
  .panel-flat { border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); }
  .chip { border: 1px solid var(--border-strong); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: transparent; }
  .chip-slot { background: var(--accent-soft); color: var(--accent-text); border-color: color-mix(in srgb, var(--accent) 75%, var(--ink) 10%);
    transition: transform 180ms var(--ease), background-color 160ms ease, color 160ms ease, box-shadow 200ms ease; }
  @media (hover: hover) and (pointer: fine) {
    button.chip-slot:hover { background: var(--accent); color: var(--accent-ink); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
  }
  .badge { border: 1px solid var(--border); }
  .badge-lock { background: var(--accent); color: var(--accent-ink); }
  .status { border: 1px solid var(--border); }
  .status.free { border-color: color-mix(in srgb, var(--ok) 25%, transparent); }
  .status.conflict, .status.error { border-color: color-mix(in srgb, var(--bad) 25%, transparent); }
  .locked { border: 1px dashed var(--border-strong); }
  details.requester > summary { border: 1px solid var(--border-strong); background: var(--card); }
  .link-box textarea { border: 1px solid var(--border); }
  .meter .cells span { border: 1px solid var(--border-strong); }
  .meter .cells span.used { background: var(--ink); border-color: var(--ink); }
  .toast { border: 0; box-shadow: var(--shadow-lg); border-radius: 14px; }
  .day-title::after { height: 1px; background: var(--border); }
  .venue-row + .venue-row, .agenda-item + .agenda-item, .board-row + .board-row, .usage-row { border-top: 1px solid var(--hair); }
  .venue-row { transition: background-color 180ms ease; }
  @media (hover: hover) and (pointer: fine) { .venue-row:hover { background: color-mix(in srgb, var(--sunk) 60%, transparent); } }
  .venue-card { box-shadow: var(--shadow-sm); transition: transform 220ms var(--ease), box-shadow 220ms var(--ease), border-color 200ms ease; }
  @media (hover: hover) and (pointer: fine) { .venue-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--border-strong); } }
  .agenda-free { background: var(--accent-soft); }
  .footer { border-top: 1px solid var(--border); }
  .footer-links a { position: relative; text-decoration: none; }
  .footer-links a::after { content: ''; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; background: var(--accent);
    transform: scaleX(0); transform-origin: left; transition: transform 260ms var(--ease); }
  @media (hover: hover) and (pointer: fine) { .footer-links a:hover { text-decoration: none; } .footer-links a:hover::after { transform: scaleX(1); } }

  /* Custom loader: a calendar page scanned row by row; free slots light up in lime, then a tick */
  .loader { padding: 40px 20px 28px; gap: 16px; }
  .loader svg.cal-loader { width: 88px; height: 88px; overflow: visible; }
  .loader rect { animation: none; stroke: none; }
  .cal-loader .page { fill: var(--card); stroke: var(--ink); stroke-width: 3; }
  .cal-loader .top { fill: var(--ink); }
  .cal-loader .ring { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
  .cal-loader .cell { fill: var(--sunk); transform-box: fill-box; transform-origin: center;
    animation: calCell 2.2s var(--ease) infinite; animation-delay: calc(var(--d) * 90ms); }
  .cal-loader .cell.busy { animation-name: calBusy; }
  .cal-loader .scan { fill: var(--accent); opacity: .35; animation: calScan 2.2s var(--ease-io) infinite; }
  .cal-loader .tick { fill: none; stroke: var(--accent-ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 30; stroke-dashoffset: 30; animation: calTick 2.2s var(--ease) infinite; }
  .cal-loader .tick-bg { fill: var(--accent); transform-box: fill-box; transform-origin: center; animation: calTickBg 2.2s var(--pop) infinite; }
  @keyframes calCell { 0%, 12% { fill: var(--sunk); transform: scale(1); } 22% { fill: var(--accent); transform: scale(0.8); } 32%, 70% { fill: var(--accent); transform: scale(1); } 85%, 100% { fill: var(--sunk); } }
  @keyframes calBusy { 0%, 12% { fill: var(--sunk); } 22%, 70% { fill: var(--border-strong); } 85%, 100% { fill: var(--sunk); } }
  @keyframes calScan { 0% { transform: translateY(0); opacity: 0; } 8% { opacity: .35; } 55% { transform: translateY(42px); opacity: .35; } 62%, 100% { transform: translateY(42px); opacity: 0; } }
  @keyframes calTick { 0%, 58% { stroke-dashoffset: 30; } 72%, 86% { stroke-dashoffset: 0; } 96%, 100% { stroke-dashoffset: 30; } }
  @keyframes calTickBg { 0%, 56% { transform: scale(0); } 66%, 86% { transform: scale(1); } 96%, 100% { transform: scale(0); } }
  .loader p { font-weight: 600; color: var(--ink-2); }
  .loader .dots::after { content: ''; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

  /* Skeleton rows shown under the loader while results load */
  .skeleton { display: grid; gap: 10px; padding: 0 18px 22px; }
  .skeleton span { display: block; height: 44px; border-radius: 12px; background: var(--sunk); position: relative; overflow: hidden; }
  .skeleton span:nth-child(2) { width: 86%; } .skeleton span:nth-child(3) { width: 72%; }
  .skeleton span::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--card) 70%, transparent), transparent); animation: shimmer 1.4s var(--ease-io) infinite; }
  @keyframes shimmer { to { transform: translateX(100%); } }

  /* Landing hero: soft lime glow and a fading dot grid behind the live board */
  .hero { position: relative; isolation: isolate; padding: 64px 0 72px; overflow: hidden; }
  .hero::before { content: ''; position: absolute; inset: -20% -10% auto auto; width: 720px; height: 720px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(closest-side, var(--hero-glow), transparent 70%); filter: blur(10px); animation: glowDrift 14s ease-in-out infinite alternate; z-index: -1; }
  .hero::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: -1;
    background-image: radial-gradient(color-mix(in srgb, var(--ink) 16%, transparent) 1.2px, transparent 1.3px); background-size: 22px 22px;
    -webkit-mask-image: radial-gradient(ellipse 60% 70% at 75% 40%, #000 20%, transparent 75%); mask-image: radial-gradient(ellipse 60% 70% at 75% 40%, #000 20%, transparent 75%); }
  @keyframes glowDrift { from { transform: translate(0, 0) scale(1); } to { transform: translate(-60px, 40px) scale(1.12); } }
  .hero h1 { font-size: clamp(42px, 6vw, 74px); line-height: 1.02; max-width: 13ch; }
  .hero h1 .word { display: inline-block; opacity: 0; transform: translateY(0.4em) rotate(2deg); animation: wordIn 700ms var(--ease) forwards; animation-delay: calc(var(--w) * 70ms + 80ms); }
  @keyframes wordIn { to { opacity: 1; transform: none; } }
  .squiggle path { stroke: var(--accent); stroke-width: 5; animation-delay: 650ms; vector-effect: non-scaling-stroke; }
  .squiggle svg { z-index: 0; left: 1%; width: 98%; bottom: -0.26em; height: 0.2em; }
  .lead { opacity: 0; animation: fadeUp 700ms 420ms var(--ease) forwards; }
  .hero-actions { opacity: 0; animation: fadeUp 700ms 520ms var(--ease) forwards; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .board { border-radius: 24px; box-shadow: var(--shadow-lg); animation: boardIn 900ms 250ms var(--ease) both; }
  @keyframes boardIn { from { opacity: 0; transform: translateY(24px) rotate(1.5deg) scale(0.97); } }
  @media (hover: hover) and (pointer: fine) { .board { transition: transform 500ms var(--ease); } .board:hover { transform: translateY(-4px) rotate(-0.4deg); } }
  .board-head { background: var(--inverse); color: var(--inverse-ink); padding: 16px 20px; }
  .live::before { background: var(--accent); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); animation: livePing 1.8s var(--ease) infinite; }
  @keyframes livePing { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 80%, 100% { box-shadow: 0 0 0 8px transparent; } }
  .board-count strong { font-size: 54px; font-variant-numeric: tabular-nums; }
  .board-row { transition: background-color 160ms ease, transform 200ms var(--ease); }
  @media (hover: hover) and (pointer: fine) { .board-row:hover { background: var(--accent-soft); transform: translateX(4px); } }
  .board-row .until { padding: 3px 9px; border-radius: 99px; background: var(--sunk); }

  /* How it works: steps joined by a line that draws when the section scrolls in */
  .flow { grid-template-columns: 1fr; gap: 36px; }
  .flow-list { grid-template-columns: repeat(3, 1fr); gap: 28px; position: relative; counter-reset: none; }
  .flow-list::before { content: ''; position: absolute; top: 44px; left: 12%; right: 12%; height: 2px; z-index: 0;
    background: linear-gradient(90deg, var(--accent), var(--ink)); transform: scaleX(0); transform-origin: left; transition: transform 1.2s var(--ease) 200ms; }
  .flow-list.in::before { transform: scaleX(1); }
  .flow-item { position: relative; z-index: 1; grid-template-columns: 1fr; justify-items: start; gap: 14px; padding: 0; border: 0; background: none; box-shadow: none; }
  .flow-item svg { width: 88px; height: 88px; padding: 8px; border-radius: 26px; background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow-md);
    transition: transform 400ms var(--pop); }
  @media (hover: hover) and (pointer: fine) { .flow-item:hover svg { transform: translateY(-4px) rotate(-4deg); } }
  .flow-item h3 { font-size: 24px; }

  /* Bento: each tile has its own surface */
  .bento { grid-auto-rows: 160px; }
  .tile { border: 1px solid var(--border); box-shadow: var(--shadow-sm); border-radius: 22px; position: relative; overflow: hidden; isolation: isolate;
    transition: transform 320ms var(--ease), box-shadow 320ms var(--ease); }
  .tile .label i { transition: transform 260ms var(--ease); }
  .tile:active { transform: scale(0.98); box-shadow: var(--shadow-sm); }
  @media (hover: hover) and (pointer: fine) {
    .tile:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    .tile:hover .label i { transform: translateX(4px); }
  }
  .tile-big { background: var(--inverse); color: var(--inverse-ink); border-color: transparent; }
  .tile-big .count { color: var(--accent); font-size: 104px; }
  .tile-big::before { content: ''; position: absolute; inset: 0; z-index: -1; opacity: .5;
    background-image: linear-gradient(var(--inverse-line) 1px, transparent 1px), linear-gradient(90deg, var(--inverse-line) 1px, transparent 1px);
    background-size: 28px 28px; -webkit-mask-image: linear-gradient(200deg, #000, transparent 70%); mask-image: linear-gradient(200deg, #000, transparent 70%); }
  .tile-big::after { content: ''; position: absolute; width: 260px; height: 260px; right: -70px; bottom: -90px; border-radius: 50%; z-index: -1;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 55%, transparent), transparent); transition: transform 600ms var(--ease); }
  @media (hover: hover) and (pointer: fine) { .tile-big:hover::after { transform: scale(1.25) translate(-20px, -10px); } }
  .tile-lemon { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .tile-mint { background: var(--card); color: var(--ink);
    background-image: radial-gradient(color-mix(in srgb, var(--ink) 18%, transparent) 1.4px, transparent 1.5px); background-size: 14px 14px; }
  .tile-mint .count { color: var(--ink); }
  .tile-grid { background-color: var(--accent-soft); color: var(--ink); background-image: none; }
  .tile-pink { background: var(--card); color: var(--ink); border: 1.5px dashed var(--border-strong); box-shadow: none; }

  /* Plans */
  .plan { border-radius: 24px; transition: transform 320ms var(--ease), box-shadow 320ms var(--ease); }
  @media (hover: hover) and (pointer: fine) { .plan:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); } }
  .plan-pro { background: var(--inverse); color: var(--inverse-ink); border-color: transparent; position: relative; overflow: hidden; isolation: isolate; }
  .plan-pro .muted { color: color-mix(in srgb, var(--inverse-ink) 70%, transparent); }
  .plan-pro::before { content: ''; position: absolute; width: 340px; height: 340px; top: -150px; right: -120px; border-radius: 50%; z-index: -1;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 45%, transparent), transparent); }
  .plan-pro li i { color: var(--accent); }

  /* App pages: a soft band behind the page title */
  .page { position: relative; isolation: isolate; }
  .page::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 240px; z-index: -1; pointer-events: none;
    background: radial-gradient(60% 100% at 85% 0%, var(--hero-glow), transparent 70%); opacity: .6; }
  .page-head h1 { font-size: clamp(34px, 4.2vw, 50px); }
  .find-form { padding: 18px; }
  .results-head h2 { font-size: 26px; }
  .day-title { font-size: 17px; }
  .spec-card, .summary-card { border-radius: 24px; }
  .summary-card { box-shadow: var(--shadow-lg); }

  /* Scroll reveal (JS adds .reveal, then .in when the element is on screen) */
  .reveal { opacity: 0; transform: translateY(22px); transition: opacity 700ms var(--ease), transform 700ms var(--ease); transition-delay: calc(var(--rd, 0) * 80ms); }
  .reveal.in { opacity: 1; transform: none; }

  /* View change: content rises in with a short blur */
  .view-enter { animation: viewIn2 420ms var(--ease); }
  @keyframes viewIn2 { from { opacity: 0; transform: translateY(12px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
  .stagger > * { animation: viewIn2 520ms var(--ease) both; animation-delay: calc(min(var(--i, 0), 12) * 45ms); }

  /* Report an issue */
  .report-grid { display: grid; grid-template-columns: 1fr 340px; gap: 24px; align-items: start; }
  .report-form { padding: 24px; display: grid; gap: 20px; position: relative; }
  .kind-pick { border: 0; margin: 0; padding: 0; min-width: 0; }
  .kind-pick legend { font-size: 13px; font-weight: 700; margin-bottom: 10px; padding: 0; }
  .kind-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .kind-opt { position: relative; cursor: pointer; }
  .kind-opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .kind-opt span { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 10px 14px; border: 1px solid var(--border-strong); border-radius: 16px;
    background: var(--card); font-weight: 600; font-size: 14px; transition: border-color 160ms ease, background-color 160ms ease, transform 180ms var(--ease), box-shadow 200ms ease; }
  .kind-opt span i { font-size: 20px; color: var(--ink-2); transition: color 160ms ease, transform 300ms var(--pop); }
  .kind-opt input:checked + span { border-color: var(--ink); background: var(--accent-soft); box-shadow: var(--shadow-sm); }
  .kind-opt input:checked + span i { color: var(--ink); transform: scale(1.15) rotate(-6deg); }
  .kind-opt input:focus-visible + span { outline: 3px solid color-mix(in srgb, var(--accent) 75%, var(--ink)); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) { .kind-opt:hover span { transform: translateY(-2px); } }
  .report-toggles { display: grid; gap: 4px; }
  .report-toggles .switch { height: 38px; }
  .report-aside { padding: 24px; display: grid; gap: 14px; position: sticky; top: 88px; }
  .report-aside > svg { width: 84px; height: 84px; }
  .report-aside h2 { font-size: 22px; }
  .next-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; font-size: 14px; color: var(--ink-2); }
  .next-list li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
  .next-list i { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--ink); font-size: 17px; }
  @media (max-width: 960px) { .report-grid { grid-template-columns: 1fr; } .report-aside { position: static; } }

  /* Form status banner on Book */
  .form-state { display: grid; gap: 8px; padding: 12px 14px; border-radius: 14px; font-size: 13px; border: 1px solid var(--border); background: var(--sunk); }
  .form-state strong { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .form-state.closed { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 25%, transparent); }
  .form-state.closed strong { color: var(--bad); }
  .form-state.open strong { color: var(--ok); }
  .form-state .row { display: flex; flex-wrap: wrap; gap: 8px; }

  @media (max-width: 960px) {
    .flow-list { grid-template-columns: 1fr; gap: 22px; }
    .flow-list::before { top: 12%; bottom: 12%; left: 44px; right: auto; width: 2px; height: auto; transform: scaleY(0); transform-origin: top;
      background: linear-gradient(180deg, var(--accent), var(--ink)); }
    .flow-list.in::before { transform: scaleY(1); }
    .flow-item { grid-template-columns: 88px 1fr; align-items: center; }
    .hero::before { width: 460px; height: 460px; }
  }
  @media (max-width: 720px) {
    .tabbar { left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); border: 1px solid var(--border); border-radius: 22px;
      padding: 6px; background: color-mix(in srgb, var(--card) 82%, transparent); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
      box-shadow: var(--shadow-lg); }
    .tabbar a { border-radius: 16px; transition: background-color 200ms var(--ease), color 160ms ease; }
    .tabbar a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
    body { padding-bottom: calc(88px + env(safe-area-inset-bottom)); }
    .toast-region { bottom: calc(96px + env(safe-area-inset-bottom)); }
    .hero { padding: 36px 0 48px; }
    .hero h1 { font-size: 44px; }
    .tile-big .count { font-size: 68px; }
    .board-count strong { font-size: 44px; }
  }
  @media (prefers-reduced-transparency: reduce) {
    .topbar, .tabbar { background: var(--paper); backdrop-filter: none; -webkit-backdrop-filter: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; }
    .hero h1 .word, .lead, .hero-actions, .board { opacity: 1; transform: none; animation: none; }
    .hero::before { animation: none; }
    .flow-list::before { transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
    .squiggle path { stroke-dashoffset: 0; }
  }
  /* ---------- Home: stats strip and feature showcase ---------- */
  .stats-strip { padding: 8px 0 8px; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .stat { padding: 22px 20px; display: grid; gap: 4px; }
  .stat:first-child { padding-left: 0; }
  .stat + .stat { border-left: 1px solid var(--border); }
  .stat strong { font: 700 clamp(28px, 3.4vw, 40px)/1 var(--display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--ink-2); font-size: 14px; }
  .eyebrow { font: 600 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent-text); margin: 0 0 12px; }
  .features .section-lead { margin-bottom: 40px; }
  .feature { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: clamp(24px, 5vw, 72px); align-items: center; padding: 36px 0; border-top: 1px solid var(--hair); }
  .feature.flip .feature-copy { order: 2; }
  .feature-num { font: 600 13px/1 var(--mono); color: var(--accent-text); display: block; margin-bottom: 14px; }
  .feature h3 { font: 700 clamp(24px, 2.6vw, 32px)/1.1 var(--display); letter-spacing: -0.025em; margin: 0 0 12px; }
  .feature p { color: var(--ink-2); max-width: 46ch; margin: 0 0 18px; line-height: 1.6; }
  .link-arrow { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--ink); text-decoration: none; border-bottom: 1.5px solid var(--accent); padding-bottom: 2px; }
  .link-arrow i { transition: transform .3s var(--ease); }
  .link-arrow:hover i { transform: translateX(4px); }
  .feature-art { padding: 18px; background: var(--card); border-radius: var(--r-lg); overflow: hidden; }
  .fa { display: block; width: 100%; height: auto; font-family: var(--mono); }

  .fa-bar, .fa-field, .fa-sheet { fill: var(--card); stroke: var(--border-strong); stroke-width: 1.5; }
  .fa-glass { fill: none; stroke: var(--ink-2); stroke-width: 2; }
  .fa-typed, .fa-name, .fa-lbl, .fa-line { fill: var(--border-strong); }
  .fa-go { fill: var(--ink); }
  .fa-track, .fa-col { fill: var(--sunk); }
  .fa-busy { fill: var(--border-strong); }
  .fa-free { fill: var(--accent); transform-box: fill-box; transform-origin: left center; }
  .fa-scan { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 3 4; opacity: 0; }
  .fa-day { fill: var(--ink-2); font-size: 10px; font-weight: 600; text-anchor: middle; letter-spacing: .08em; }
  .fa-ev { fill: var(--border-strong); transform-box: fill-box; transform-origin: center top; }
  .fa-gap { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .fa-fill { fill: var(--ink); transform-box: fill-box; transform-origin: left center; }
  .fa-stamp circle { fill: var(--accent); }
  .fa-stamp path { fill: none; stroke: var(--accent-ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .fa-stamp { transform-box: fill-box; transform-origin: center; }
  .fa-ring { fill: none; stroke: var(--sunk); stroke-width: 12; }
  .fa-arc { fill: none; stroke: var(--accent); stroke-width: 12; stroke-linecap: round; stroke-dasharray: 37 60; transform: rotate(-90deg); transform-origin: 100px 100px; }
  .fa-big { fill: var(--ink); font: 700 40px/1 var(--display); text-anchor: middle; }
  .fa-small { fill: var(--ink-2); font-size: 9px; font-weight: 600; text-anchor: middle; letter-spacing: .12em; }
  .fa-pill { fill: var(--ok-soft); }
  .fa-dot { fill: var(--ok); }
  .fa-pilltext { fill: var(--ok); font-size: 12px; font-weight: 700; font-family: var(--body); }

  /* Scenes start in their "before" state and play once the card is in view. */
  @media (prefers-reduced-motion: no-preference) {
    .feature.reveal .fa-free { transform: scaleX(0); }
    .feature.in .fa-free { animation: faGrow .7s var(--ease) both; animation-delay: calc(var(--d) * 90ms + 300ms); }
    .feature.in .fa-scan { animation: faScan 2.6s var(--ease-io) .2s both; }
    .feature.in .fa-typed { animation: faType 1s steps(8) both; transform-box: fill-box; transform-origin: left; }
    .feature.reveal .fa-ev { opacity: 0; }
    .feature.in .fa-ev { animation: faDrop .55s var(--pop) both; animation-delay: calc(var(--d) * 80ms + 200ms); }
    .feature.in .fa-gap { animation: faPulse 1.8s ease-in-out 1s infinite; }
    .feature.reveal .fa-fill { transform: scaleX(0); }
    .feature.in .fa-fill { animation: faGrow .8s steps(10) both; animation-delay: calc(var(--d) * 650ms + 200ms); }
    .feature.reveal .fa-stamp { transform: scale(0); }
    .feature.in .fa-stamp { animation: faStamp .5s var(--pop) 2.9s both; }
    .feature.reveal .fa-arc { stroke-dasharray: 0 60; }
    .feature.in .fa-arc { animation: faArc 1.4s var(--ease) .2s both; }
    .feature.in .fa-dot { animation: faBlink 1.6s ease-in-out infinite; }
  }
  @keyframes faGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes faScan { 0% { opacity: 1; transform: translateX(0); } 90% { opacity: 1; transform: translateX(222px); } 100% { opacity: 0; transform: translateX(222px); } }
  @keyframes faType { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes faDrop { from { opacity: 0; transform: translateY(-10px) scaleY(.6); } to { opacity: 1; transform: none; } }
  @keyframes faPulse { 50% { fill-opacity: .4; } }
  @keyframes faStamp { from { transform: scale(0) rotate(-20deg); } to { transform: none; } }
  @keyframes faArc { from { stroke-dasharray: 0 60; } to { stroke-dasharray: 37 60; } }
  @keyframes faBlink { 50% { opacity: .25; } }

  @media (max-width: 760px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat:nth-child(3) { border-left: 0; padding-left: 0; }
    .stat:nth-child(n+3) { border-top: 1px solid var(--border); }
    .feature { grid-template-columns: 1fr; gap: 20px; padding: 28px 0; }
    .feature.flip .feature-copy { order: 0; }
  }

  /* ---------- Loaders: clock, form, inline spinner, busy buttons, boot ---------- */
  .clk-loader, .doc-loader { width: 96px; height: 96px; }
  .clk-loader .face { fill: var(--card); stroke: var(--ink); stroke-width: 3; }
  .clk-loader .tk { stroke: var(--ink-2); stroke-width: 2.5; stroke-linecap: round; }
  .clk-loader .sweep { fill: none; stroke: var(--accent); stroke-width: 6; stroke-dasharray: 22 100; stroke-linecap: round; opacity: .9;
    transform-origin: 48px 48px; animation: spinTurn 1.6s linear infinite; }
  .clk-loader .mh, .clk-loader .hh { stroke: var(--ink); stroke-linecap: round; transform-origin: 48px 48px; }
  .clk-loader .mh { stroke-width: 3; animation: spinTurn 1.6s linear infinite; }
  .clk-loader .hh { stroke-width: 4; animation: spinTurn 19.2s linear infinite; }
  .clk-loader .hub { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
  .doc-loader .sheet { fill: var(--card); stroke: var(--ink); stroke-width: 3; }
  .doc-loader .lbl { fill: var(--border-strong); }
  .doc-loader .ln { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100;
    animation: docWrite 2.4s var(--ease) infinite; animation-delay: calc(var(--d) * 300ms); }
  .doc-loader .ln:last-of-type { stroke: var(--accent); }
  .doc-loader .pen path { fill: var(--accent); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
  .doc-loader .pen { animation: docPen 2.4s var(--ease-io) infinite; }
